<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lista 1</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main class="player-page">

    <header class="topbar">

      <a href="index.html" class="back">
        ← Volver
      </a>

      <div class="brand">
        <img src="logo.png" alt="Logo">
      </div>

      <span class="top-title">
        LISTA 1
      </span>

    </header>


    <section class="player-layout">


      <!-- REPRODUCTOR -->

      <div class="player-panel">

        <div class="now-label">
          REPRODUCIENDO
        </div>

        <div class="cover">
          <img src="logo.png" alt="Lista 1">
        </div>

        <div class="now-info">

          <span id="track-status">
            LISTA 1
          </span>

          <h1>
            Lista 1
          </h1>

          <p>
            KQ105 Final #1
          </p>

        </div>


        <audio
          id="audio"
          controls
          preload="metadata"
          src="https://analog-metallic-steal-itunes.trycloudflare.com/KQ105%20Final%20%231.wav">
        </audio>

      </div>


      <!-- CUADRO DE LA LISTA -->

      <aside class="queue-panel">

        <div class="queue-header">

          <div>

            <span class="now-label">
              LISTA
            </span>

            <h2>
              Canciones
            </h2>

          </div>

          <span id="count">
            —
          </span>

        </div>


        <div id="queue" class="queue">
          Cargando lista...
        </div>

      </aside>


    </section>

  </main>


  <script>

    fetch("lista1.txt")

      .then(response => {

        if (!response.ok) {
          throw new Error("No se pudo cargar lista1.txt");
        }

        return response.text();

      })

      .then(text => {

        const queue =
          document.getElementById("queue");

        const lines =
          text
            .split(/\r?\n/)
            .map(line => line.trim())
            .filter(line => line !== "");


        queue.innerHTML = "";

        lines.forEach((line, index) => {

          const item =
            document.createElement("div");

          item.className = "queue-item";

          item.innerHTML = `
            <span class="queue-number">
              ${String(index + 1).padStart(2, "0")}
            </span>

            <span class="queue-song">
              ${line}
            </span>
          `;

          queue.appendChild(item);

        });


        document.getElementById("count").textContent =
          lines.length;


      })

      .catch(error => {

        console.error(error);

        document.getElementById("queue").innerHTML =
          "<p>No se pudo cargar lista1.txt</p>";

      });

  </script>

</body>
</html>
