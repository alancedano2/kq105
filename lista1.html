<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista 1</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main class="player-page">

    <header class="topbar">
      <a href="index.html" class="back">← Volver</a>

      <div class="brand">
        <img src="logo.png" alt="Logo">
      </div>

      <span class="top-title">LISTA 1</span>
    </header>

    <section class="player-layout">

      <div class="player-panel">

        <div class="now-label">REPRODUCIENDO</div>

        <div class="cover">
          <img src="logo.png" alt="Lista 1">
        </div>

        <div class="now-info">
          <span>LISTA 1</span>
          <h1>Lista 1</h1>
        </div>

        <!-- WAV -->
        <audio
          id="audio"
          controls
          preload="metadata"
          src="https://analog-metallic-steal-itunes.trycloudflare.com/KQ105%20Final%20%231.wav">
        </audio>

        <!-- CONTENIDO DEL TXT -->
        <div class="tracklist">
          <h2>Canciones</h2>
          <pre id="lista">Cargando lista...</pre>
        </div>

      </div>

    </section>

  </main>

  <script>
    fetch("/listas/lista1.txt")
      .then(response => {
        if (!response.ok) {
          throw new Error("No se pudo cargar lista1.txt");
        }

        return response.text();
      })
      .then(text => {
        document.getElementById("lista").textContent = text;
      })
      .catch(() => {
        document.getElementById("lista").textContent =
          "No se pudo cargar la lista.";
      });
  </script>

</body>
</html>
